name: Benchmark

on:
  pull_request:
    paths:
    - pkg/**/*
    - cmd/**/*
    - test/**/*
    - hack/**/*
    - kustomize/**/*
    - go.mod
    - .github/workflows/benchmark.yaml
    - '!hack/releases-helm-chart.sh'
  push:
    paths:
    - pkg/**/*
    - cmd/**/*
    - test/**/*
    - hack/**/*
    - kustomize/**/*
    - go.mod
    - .github/workflows/benchmark.yaml
    - '!hack/releases-helm-chart.sh'

env:
  CGO_ENABLED: "0"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: Test Benchmark
      shell: bash
      run: |
        ./hack/e2e-test.sh e2e/kwokctl/benchmark

    - name: Test Benchmark Hack
      shell: bash
      run: |
        ./hack/e2e-test.sh e2e/kwokctl/benchmark-hack

    - name: Upload logs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: kwok-logs-benchmark
        path: ${{ github.workspace }}/logs
