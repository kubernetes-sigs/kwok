apiVersion: v1
kind: Pod
metadata:
  name: partition-pod
  namespace: default
spec:
  nodeSelector:
    amd.com/gpu.compute-memory-partition: cpx_nps2
  containers:
  - name: fake-container
    image: fake-image
    resources:
      limits:
        amd.com/gpu: "1"
  tolerations:
  - key: "kwok.x-k8s.io/node"
    operator: "Exists"
    effect: "NoSchedule"
