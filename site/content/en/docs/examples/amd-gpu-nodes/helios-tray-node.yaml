    kubernetes.io/hostname: amd-helios-tray-node
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    feature.node.kubernetes.io/amd-gpu: "true"
    amd.com/gpu.vram: 432G
    beta.amd.com/gpu.vram: 432G
    beta.amd.com/gpu.vram.432G: "4"
