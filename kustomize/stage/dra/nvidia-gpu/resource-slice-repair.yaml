apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: nvidia-gpu-resource-slice-repair
spec:
  resourceRef:
    apiGroup: resource.k8s.io/v1
    kind: ResourceSlice
  selector:
    matchExpressions:
    - cel:
        expression: >-
          !has(self.metadata.deletionTimestamp)
    - cel:
        expression: >-
          self.spec.driver == 'gpu.nvidia.com'
    - cel:
        expression: >-
          has(self.metadata.annotations) && 'kwok.x-k8s.io/dra-nvidia-gpu' in self.metadata.annotations && 'kwok.x-k8s.io/dra-nvidia-gpu-memory' in self.metadata.annotations
    - cel:
        expression: >-
          !has(self.spec.devices) || size(self.spec.devices) != int(self.metadata.annotations['kwok.x-k8s.io/dra-nvidia-gpu']) || self.spec.devices[0].capacity.memory.value != self.metadata.annotations['kwok.x-k8s.io/dra-nvidia-gpu-memory']
  steps:
  - patch:
      root: spec
      template: |
        {{ $nodeUID := (index .metadata.ownerReferences 0).uid }}
        {{ $count := index .metadata.annotations "kwok.x-k8s.io/dra-nvidia-gpu" }}
        {{ $memory := index .metadata.annotations "kwok.x-k8s.io/dra-nvidia-gpu-memory" }}
        devices:
        {{ range $index := until (atoi $count) }}
        - name: gpu-{{ $index }}
          attributes:
            type:
              string: gpu
            uuid:
              string: GPU-{{ $nodeUID }}-{{ $index }}
            productName:
              string: NVIDIA H100 80GB HBM3
            brand:
              string: Nvidia
            architecture:
              string: Hopper
            cudaComputeCapability:
              version: "9.0.0"
            driverVersion:
              version: "550.54.15"
            cudaDriverVersion:
              version: "12.4.0"
            resource.kubernetes.io/numaNode:
              int: 0
          capacity:
            memory:
              value: {{ $memory | Quote }}
        {{ end }}
