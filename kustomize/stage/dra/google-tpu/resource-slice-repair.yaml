apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: google-tpu-resource-slice-repair
spec:
  resourceRef:
    apiGroup: resource.k8s.io/v1
    kind: ResourceSlice
  selector:
    matchExpressions:
    - cel:
        expression: >-
          !has(self.metadata.deletionTimestamp)
    - cel:
        expression: >-
          self.spec.driver == 'tpu.google.com'
    - cel:
        expression: >-
          has(self.metadata.annotations) && 'kwok.x-k8s.io/dra-google-tpu' in self.metadata.annotations && 'kwok.x-k8s.io/dra-google-tpu-gen' in self.metadata.annotations
    - cel:
        expression: >-
          !has(self.spec.devices) || size(self.spec.devices) != int(self.metadata.annotations['kwok.x-k8s.io/dra-google-tpu']) || self.spec.devices[0].attributes.tpuGen.string != self.metadata.annotations['kwok.x-k8s.io/dra-google-tpu-gen']
  steps:
  - patch:
      root: spec
      template: |
        {{ $nodeUID := (index .metadata.ownerReferences 0).uid }}
        {{ $count := index .metadata.annotations "kwok.x-k8s.io/dra-google-tpu" }}
        {{ $tpuGen := index .metadata.annotations "kwok.x-k8s.io/dra-google-tpu-gen" }}
        devices:
        {{ range $index := until (atoi $count) }}
        - name: accel{{ $index }}
          attributes:
            index:
              int: {{ $index }}
            tpuGen:
              string: {{ $tpuGen | Quote }}
            uuid:
              string: tpu-{{ $nodeUID }}
        {{ end }}
